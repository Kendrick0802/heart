        a {
            text-decoration: none;
            color: inherit;
            width: 10%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 10px;
            background: rgba(255, 255, 255, 0.12);
            transition: background 0.5s ease;
            padding: 10px;

        }
        .box a {
            text-decoration: none;
            color: inherit;
            display: block;
            width: 100%;
            height: 100%;
        }

        .image-slot {
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 10px;
            background: rgba(255, 255, 255, 0.12);
            transition: background 0.3s ease;
            padding: 10px;
        }

        .image-slot span {
            font-size: 1rem;
            color: white;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            text-shadow: 0 1px 3px rgba(0, 0, 0, 0.4);
        }

        .box:hover .image-slot {
            background: rgba(255, 255, 255, 0.18);

.boxes-grid {

    grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));

}

    box-shadow: 0 4px 6px rgba(0, 0, 0, 0.2);
    font-weight: bold;
    color: white;
    font-size: 1.1em;
